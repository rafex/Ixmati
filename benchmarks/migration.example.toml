# Ejemplo para una ventana offline. Las rutas deben ser absolutas o relativas
# al directorio desde el que se ejecuta ixmati-store-migrate.
operation = "rename"
hash_algorithm = "sha256-key-v1"
quiesced = true
evidence_dir = "./evidence/store-migration"

[[sources]]
name = "pedidos"
path = "/var/lib/ixmati/stores/pedidos.db"

[target]
name = "orders"
path = "/var/lib/ixmati/stores/orders.db"

