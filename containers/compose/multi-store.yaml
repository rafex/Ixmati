# containers/compose/multi-store.yaml — stack, 3 stores + projector + reconciler (ejemplo: pedidos, usuarios, inventario)

name: ixmati-multi

x-store: &store-template
  environment:
    - MQTT_BROKER=tcp://mosquitto:30200
    - CACHE_SOCKET_PATH=/var/run/ixmati/cache.sock
  depends_on:
    mosquitto:
      condition: service_healthy
  volumes:
    - cache_socket:/var/run/ixmati:U

services:
  mosquitto:
    image: localhost/ixmati-mosquitto:local
    build:
      context: ../mosquitto
      dockerfile: Containerfile
    ports:
      - "30200:30200"
    volumes:
      - mosquitto_data:/mosquitto/data:U
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-p", "30200", "-t", "health", "-m", "1", "-q", "0"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  cache-server:
    image: localhost/ixmati-cache-server:local
    build:
      context: ../..
      dockerfile: containers/cache-server/Containerfile
    environment:
      - CACHE_BACKEND=redb
      - CACHE_DIR=/var/lib/ixmati/cache
      - CACHE_SOCKET_PATH=/var/run/ixmati/cache.sock
      - RUST_LOG=ixmati_cache_server=info
    volumes:
      - cache_data:/var/lib/ixmati/cache:U
      - cache_socket:/var/run/ixmati:U
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/ixmati/cache.sock"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: localhost/ixmati-api:local
    build:
      context: ../..
      dockerfile: containers/api/Containerfile
    ports:
      - "30000:30000"
      - "30100:30100"
    environment:
      - MQTT_BROKER=tcp://mosquitto:30200
      - API_HOST=0.0.0.0
      - CACHE_SOCKET_PATH=/var/run/ixmati/cache.sock
      - CACHE_READ_MODE=socket
      - IXMATI_API_KEYS=ix-default-key
      - SQLITE_PATHS=pedidos=/data/pedidos/pedidos.db,usuarios=/data/usuarios/usuarios.db,inventario=/data/inventario/inventario.db
      - RUST_LOG=ixmati_api=info
    depends_on:
      mosquitto:
        condition: service_healthy
      cache-server:
        condition: service_healthy
    volumes:
      - cache_socket:/var/run/ixmati:U
      - store_pedidos:/data/pedidos:ro
      - store_usuarios:/data/usuarios:ro
      - store_inventario:/data/inventario:ro

  writer-pedidos:
    image: localhost/ixmati-writer:local
    build:
      context: ../..
      dockerfile: containers/writer/Containerfile
    <<: *store-template
    environment:
      - MQTT_BROKER=tcp://mosquitto:30200
      - STORE_NAME=pedidos
      - SQLITE_PATH=/data/pedidos.db
      - CACHE_SOCKET_PATH=/var/run/ixmati/cache.sock
    depends_on:
      mosquitto:
        condition: service_healthy
      cache-server:
        condition: service_healthy
    volumes:
      - store_pedidos:/data:U
      - cache_socket:/var/run/ixmati:U
    deploy:
      replicas: 1

  writer-usuarios:
    image: localhost/ixmati-writer:local
    <<: *store-template
    environment:
      - MQTT_BROKER=tcp://mosquitto:30200
      - STORE_NAME=usuarios
      - SQLITE_PATH=/data/usuarios.db
      - CACHE_SOCKET_PATH=/var/run/ixmati/cache.sock
    depends_on:
      mosquitto:
        condition: service_healthy
      cache-server:
        condition: service_healthy
    volumes:
      - store_usuarios:/data:U
      - cache_socket:/var/run/ixmati:U
    deploy:
      replicas: 1

  writer-inventario:
    image: localhost/ixmati-writer:local
    <<: *store-template
    environment:
      - MQTT_BROKER=tcp://mosquitto:30200
      - STORE_NAME=inventario
      - SQLITE_PATH=/data/inventario.db
      - CACHE_SOCKET_PATH=/var/run/ixmati/cache.sock
    depends_on:
      mosquitto:
        condition: service_healthy
      cache-server:
        condition: service_healthy
    volumes:
      - store_inventario:/data:U
      - cache_socket:/var/run/ixmati:U
    deploy:
      replicas: 1

  projector:
    image: localhost/ixmati-projector:local
    build:
      context: ../..
      dockerfile: containers/projector/Containerfile
    environment:
      - MQTT_BROKER=tcp://mosquitto:30200
      - CACHE_SOCKET_PATH=/var/run/ixmati/cache.sock
      - RUST_LOG=ixmati_projector=debug,ixmati_cache=debug
    depends_on:
      mosquitto:
        condition: service_healthy
      cache-server:
        condition: service_healthy
    volumes:
      - cache_socket:/var/run/ixmati:U

  reconciler:
    image: localhost/ixmati-reconciler:local
    build:
      context: ../..
      dockerfile: containers/reconciler/Containerfile
    environment:
      - CACHE_SOCKET_PATH=/var/run/ixmati/cache.sock
      - IXMATI_PROJECTIONS_PATH=/etc/ixmati/projections.toml
      - IXMATI_STORE_PATHS=pedidos=/data/pedidos.db,usuarios=/data/usuarios.db,inventario=/data/inventario.db
      - RUST_LOG=ixmati_reconciler=info
    depends_on:
      cache-server:
        condition: service_healthy
    volumes:
      - cache_socket:/var/run/ixmati:U
      - ../../config/projections.toml:/etc/ixmati/projections.toml:ro
      - store_pedidos:/data/pedidos.db:ro
      - store_usuarios:/data/usuarios.db:ro
      - store_inventario:/data/inventario.db:ro
    profiles:
      - reconciler

volumes:
  mosquitto_data:
  store_pedidos:
  store_usuarios:
  store_inventario:
  cache_data:
  cache_socket:
