# containers/compose/smoke.yaml — stack completo para smoke tests (rango Temp)
name: ixmati-smoke

services:
  mosquitto:
    image: localhost/ixmati-mosquitto:local
    build:
      context: ../mosquitto
      dockerfile: Containerfile
    ports:
      - "30310:30200"
    volumes:
      - mosquitto_data:/mosquitto/data:U
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-p", "30200", "-t", "health", "-m", "1", "-q", "0"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  cache-server:
    image: localhost/ixmati-cache-server:local
    build:
      context: ../..
      dockerfile: containers/cache-server/Containerfile
    environment:
      - CACHE_BACKEND=redb
      - CACHE_DIR=/var/lib/ixmati/cache
      - CACHE_SOCKET_PATH=/var/run/ixmati/cache.sock
      - RUST_LOG=ixmati_cache_server=debug
    volumes:
      - cache_data:/var/lib/ixmati/cache:U
      - cache_socket:/var/run/ixmati:U
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/ixmati/cache.sock"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  api:
    image: localhost/ixmati-api:local
    build:
      context: ../..
      dockerfile: containers/api/Containerfile
    ports:
      - "30311:30000"
      - "30312:30100"
    environment:
      - MQTT_BROKER=tcp://mosquitto:30200
      - API_HOST=0.0.0.0
      - API_PORT=30000
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=30100
      - IXMATI_API_KEYS=smoke-test-key
      - RUST_LOG=ixmati_api=debug
      - SQLITE_PATH=/data/smoke.db
      - CACHE_SOCKET_PATH=/var/run/ixmati/cache.sock
    depends_on:
      mosquitto:
        condition: service_healthy
      cache-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:30000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    volumes:
      - store_data:/data:U
      - cache_socket:/var/run/ixmati:U

  writer:
    image: localhost/ixmati-writer:local
    build:
      context: ../..
      dockerfile: containers/writer/Containerfile
    environment:
      - MQTT_BROKER=tcp://mosquitto:30200
      - STORE_NAME=smoke
      - SQLITE_PATH=/data/smoke.db
      - RUST_LOG=ixmati_writer=debug
      - CACHE_SOCKET_PATH=/var/run/ixmati/cache.sock
    depends_on:
      mosquitto:
        condition: service_healthy
      cache-server:
        condition: service_healthy
    volumes:
      - store_data:/data:U
      - cache_socket:/var/run/ixmati:U

  projector:
    image: localhost/ixmati-projector:local
    build:
      context: ../..
      dockerfile: containers/projector/Containerfile
    environment:
      - MQTT_BROKER=tcp://mosquitto:30200
      - CACHE_SOCKET_PATH=/var/run/ixmati/cache.sock
      - IXMATI_PROJECTIONS_PATH=/etc/ixmati/projections.toml
      - RUST_LOG=ixmati_projector=debug
    depends_on:
      mosquitto:
        condition: service_healthy
      cache-server:
        condition: service_healthy
    volumes:
      - cache_socket:/var/run/ixmati:U
      - ../../config/projections.toml:/etc/ixmati/projections.toml:ro

  litestream:
    image: localhost/ixmati-litestream:local
    build:
      context: ../litestream
      dockerfile: Containerfile
    environment:
      - LITESTREAM_DB_PATH=/data/smoke.db
    depends_on:
      writer:
        condition: service_started
    volumes:
      - store_data:/data:U

volumes:
  mosquitto_data:
  store_data:
  cache_data:
  cache_socket:
