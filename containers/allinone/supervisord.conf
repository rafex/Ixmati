[supervisord]
nodaemon=true
logfile=/var/log/ixmati/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mosquitto]
command=/usr/sbin/mosquitto -c /etc/mosquitto/conf.d/ixmati.conf
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ixmati-cache-server]
command=/usr/local/bin/ixmati-cache-server
environment=CACHE_BACKEND="%(ENV_CACHE_BACKEND)s",CACHE_DIR="%(ENV_CACHE_DIR)s",CACHE_SOCKET_PATH="/var/run/ixmati/cache.sock",RUST_LOG="ixmati_cache_server=info"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

[program:ixmati-writer]
command=/usr/local/bin/ixmati-writer
environment=MQTT_BROKER="tcp://localhost:1883",STORE_NAME="%(ENV_STORE_NAME)s",SQLITE_PATH="%(ENV_SQLITE_PATH)s",CACHE_SOCKET_PATH="/var/run/ixmati/cache.sock"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20

[program:ixmati-api]
command=/usr/local/bin/ixmati-api %(ENV_SQLITE_PATH)s
environment=MQTT_BROKER="tcp://localhost:1883",API_HOST="0.0.0.0",API_PORT="%(ENV_API_PORT)s",IXMATI_API_KEYS="%(ENV_IXMATI_API_KEYS)s",CACHE_SOCKET_PATH="/var/run/ixmati/cache.sock"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=30

[program:ixmati-projector]
command=/usr/local/bin/ixmati-projector
environment=MQTT_BROKER="tcp://localhost:1883",CACHE_SOCKET_PATH="/var/run/ixmati/cache.sock",IXMATI_PROJECTIONS_PATH="/etc/ixmati/projections.toml",RUST_LOG="ixmati_projector=info"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=40
