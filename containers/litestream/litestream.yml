# litestream.yml — config de replicación para el sidecar Compose.
# Litestream v0.5 usa una réplica por proceso; el despliegue nativo ejecuta
# además un proceso local y otro S3 cuando el operador configura S3.

dbs:
  - path: /data/default.db
    replica:
      path: ${LITESTREAM_FILESYSTEM_PATH:-/backup}
      sync-interval: 1s
