# Ixmati — projections.toml
# Declaración de proyecciones (opt-in).

# Pattern R: referencia + lookup (eager loading)
# pedidos_con_usuario — une pedido con datos de usuario
[[projections]]
name = "pedidos_con_usuario"
pattern = "R"
source_stores = ["pedidos", "usuarios"]
target_key = "pedido_id"
ttl_seconds = 300

# Pattern M: materializado (copia campos desde otros stores)
# usuarios_materializados — copia nombre, email desde usuarios
[[projections]]
name = "usuarios_materializados"
pattern = "M"
source_stores = ["usuarios"]
target_key = "usuario_id"
ttl_seconds = 600
[[projections.copy_fields]]
source_store = "usuarios"
source_entity = "usuario"
fields = ["nombre", "email"]
