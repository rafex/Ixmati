# Ixmati — projections.toml
# Declaración de proyecciones (opt-in).
# Si no necesitas proyecciones, deja este archivo vacío o con solo comentarios.

# Pattern R: referencia + lookup (eager loading)
# [[projections]]
# name = "pedidos_con_usuario"
# pattern = "R"
# source_stores = ["pedidos", "usuarios"]
# target_key = "pedido_id"
# ttl_seconds = 300

