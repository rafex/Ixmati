# mosquitto.conf — broker MQTT para producción con Ixmati
#
# Instalado por el instalador en /etc/ixmati/mosquitto/
# Se copia a /etc/mosquitto/conf.d/ixmati.conf

listener 1883
protocol mqtt

persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60

max_queued_messages 100000

allow_anonymous true

log_dest syslog
log_type error warning notice
