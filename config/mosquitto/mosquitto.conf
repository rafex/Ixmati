# ixmati-managed
# mosquitto.conf — broker MQTT para producción con Ixmati
#
# Instalado por el instalador en /etc/ixmati/mosquitto/
# En instalación nativa (systemd) reemplaza /etc/mosquitto/mosquitto.conf
# completo (no como fragmento conf.d/: el paquete Debian de mosquitto ya
# define persistence/persistence_location en su config por defecto, y
# mosquitto rechaza como fatal un conf.d que las duplique).

listener 1883
protocol mqtt

persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60

max_queued_messages 100000

# DEC-0055/TASK-VAL-0024: los writers ahora usan sesiones persistentes
# (`clean_session=false` + `client_id` estable, ver
# crates/ixmati-writer/src/consumer.rs) para no perder el backlog QoS1
# pendiente si el proceso se reinicia. Sin un límite, una sesión de un
# `client_id` que deja de usarse (ej. tras renombrar un store) quedaría
# retenida por Mosquitto indefinidamente. Este valor expira sesiones
# persistentes inactivas tras 7 días — mismo efecto práctico que el
# `Session Expiry Interval` de MQTT v5, sin migrar de protocolo.
persistent_client_expiration 7d

allow_anonymous true

log_dest syslog
log_type error warning notice
