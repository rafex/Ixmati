# Litestream v0.5 template for a single native replica process.
# The native installer generates separate local and S3 configs because v0.5
# supports one replica per database. Never use a moving "latest" image.

sync-interval: 1s
snapshot:
  retention: 168h
dbs:
  - dir: /var/lib/ixmati/stores
    pattern: "*.db"
    watch: true
    meta-dir: /var/lib/ixmati/litestream-meta/file
    replica:
      path: /var/lib/ixmati/backups
