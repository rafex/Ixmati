apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: ixmati
  labels:
    app: mosquitto
    app.kubernetes.io/part-of: ixmati
spec:
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: ixmati
  labels:
    app: mosquitto
    app.kubernetes.io/part-of: ixmati
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: ghcr.io/rafex/ixmati-mosquitto:latest
          ports:
            - containerPort: 1883
              name: mqtt
              protocol: TCP
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: mosquitto-data
              mountPath: /mosquitto/data
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: mosquitto-config
          configMap:
            name: ixmati-config
            items:
              - key: mosquitto.conf
                path: mosquitto.conf
        - name: mosquitto-data
          persistentVolumeClaim:
            claimName: mosquitto-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
  namespace: ixmati
  labels:
    app: mosquitto
    app.kubernetes.io/part-of: ixmati
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
