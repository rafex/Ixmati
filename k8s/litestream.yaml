apiVersion: v1
kind: Secret
metadata:
  name: litestream-credentials
  namespace: ixmati
  labels:
    app.kubernetes.io/part-of: ixmati
type: Opaque
stringData:
  replica-url: "s3://your-bucket/ixmati/stores?region=us-east-1&endpoint=https://s3.example.com"
  replica-url-2: "sftp://user:pass@backup-server/ixmati/stores"
---
apiVersion: apps/v1
kind: CronJob
metadata:
  name: ixmati-reconciler
  namespace: ixmati
  labels:
    app: ixmati-reconciler
    app.kubernetes.io/part-of: ixmati
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: reconciler
              image: ghcr.io/rafex/ixmati-reconciler:latest
              env:
                - name: STORES_CONFIG
                  value: /etc/ixmati/stores.toml
                - name: PROJECTIONS_CONFIG
                  value: /etc/ixmati/projections.toml
                - name: RUST_LOG
                  value: "ixmati_reconciler=info"
              volumeMounts:
                - name: stores-config
                  mountPath: /etc/ixmati/stores.toml
                  subPath: stores.toml
                - name: projections-config
                  mountPath: /etc/ixmati/projections.toml
                  subPath: projections.toml
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "1000m"
          restartPolicy: OnFailure
          volumes:
            - name: stores-config
              configMap:
                name: ixmati-config
                items:
                  - key: stores.toml
                    path: stores.toml
            - name: projections-config
              configMap:
                name: ixmati-config
                items:
                  - key: projections.toml
                    path: projections.toml
