name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Integration tests
        run: cargo test -p ixmati-integration

      - name: Tool boundary check
        run: |
          pip install uv
          uv run python helpers/python/lint_tool_boundary.py

  ci-main:
    if: github.ref == 'refs/heads/main'
    needs: ci-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: make build-release

      - name: Package dist
        run: make dist dist-checksums

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
