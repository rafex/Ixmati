[project]
name = "ixmati-helpers"
version = "0.1.0"
description = "Herramientas Python para Ixmati — validacion, cobertura, CI"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "jsonschema>=4.20",
    "tomli>=2.0",
    "click>=8.1",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["helpers/python/tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "SIM"]
