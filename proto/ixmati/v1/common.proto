syntax = "proto3";

package ixmati.v1;

import "google/protobuf/struct.proto";

message WriteEnvelope {
  string op = 1;
  string store = 2;
  string entity = 3;
  string key = 4;
  uint64 version = 5;
  string ts = 6;
  string idempotency_key = 7;
  string ack_mode = 8;
  // Wire-compatible field retained from the original bytes payload.
  bytes payload_bytes = 9 [deprecated = true];
  // Canonical payload for new clients.
  google.protobuf.Struct payload = 10;
}

message EventEnvelope {
  string event_id = 1;
  string event_type = 2;
  string store = 3;
  string entity = 4;
  string key = 5;
  uint64 version = 6;
  string occurred_at = 7;
  uint64 outbox_seq = 8;
  // Wire-compatible field retained from the original bytes payload.
  bytes payload_bytes = 9 [deprecated = true];
  // Canonical payload for new clients.
  google.protobuf.Struct payload = 10;
}

message AckResponse {
  string status = 1;
  string store = 2;
  string idempotency_key = 3;
  string message = 4;
}

enum WriteStatus {
  WRITE_STATUS_UNSPECIFIED = 0;
  WRITE_STATUS_ACCEPTED = 1;
  WRITE_STATUS_COMMITTED = 2;
  WRITE_STATUS_DUPLICATE = 3;
  WRITE_STATUS_VERSION_CONFLICT = 4;
  WRITE_STATUS_REJECTED = 5;
  WRITE_STATUS_PENDING = 6;
}

message ErrorDetail {
  string error = 1;
  string detail = 2;
  string store = 3;
  string idempotency_key = 4;
}
