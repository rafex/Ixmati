syntax = "proto3";

package ixmati.v1;

import "google/protobuf/struct.proto";

service ReadService {
  rpc Read (ReadRequest) returns (ReadResponse);
}

message ReadRequest {
  string store = 1;
  string entity = 2;
  string key = 3;
  string projection = 4;
}

message ReadResponse {
  bool found = 1;
  string store = 2;
  string entity = 3;
  string key = 4;
  uint64 version = 5;
  // Wire-compatible field from the original bytes response.
  bytes payload_bytes = 6 [deprecated = true];
  string projection = 7;
  string source = 8;
  // Canonical payload for new clients.
  google.protobuf.Struct payload = 9;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
    STATUS_DEGRADED = 2;
    STATUS_UNAVAILABLE = 3;
  }

  Status overall = 1;
  repeated ComponentHealth components = 2;
}

message ComponentHealth {
  string name = 1;
  HealthCheckResponse.Status status = 2;
  string detail = 3;
}

service HealthService {
  rpc Check (HealthCheckRequest) returns (HealthCheckResponse);
}
