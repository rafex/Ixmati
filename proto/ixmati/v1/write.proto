syntax = "proto3";

package ixmati.v1;

import "ixmati/v1/common.proto";

service WriteService {
  rpc Write (WriteRequest) returns (WriteResponse);
  rpc GetWriteStatus (GetWriteStatusRequest) returns (GetWriteStatusResponse);
}

service EventService {
  rpc SubscribeEvents (SubscribeEventsRequest) returns (stream EventEnvelope);
}

message WriteRequest {
  WriteEnvelope envelope = 1;
}

message WriteResponse {
  string status = 1;
  string store = 2;
  string idempotency_key = 3;
  string message = 4;
}

message GetWriteStatusRequest {
  string store = 1;
  string idempotency_key = 2;
}

message GetWriteStatusResponse {
  WriteStatus status = 1;
  string store = 2;
  string idempotency_key = 3;
  string detail = 4;
}

message SubscribeEventsRequest {
  string store = 1;
  string entity = 2;
  string key = 3;
  int64 after_outbox_seq = 4;
}
