[workspace]
members = [
    "crates/ixmati-core",
    "crates/ixmati-api",
    "crates/ixmati-writer",
    "crates/ixmati-cache",
    "crates/ixmati-projector",
    "crates/ixmati-reconciler",
    "crates/ixmati-supervisor",
    "tests/integration",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rafex/Ixmati"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
