[workspace]
members = [
    "crates/ixmati-core",
    "crates/ixmati-api",
    "crates/ixmati-writer",
    "crates/ixmati-cache",
    "crates/ixmati-projector",
    "crates/ixmati-reconciler",
    "crates/ixmati-supervisor",
    "crates/ixmati-cache-server",
    "tests/integration",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rafex/Ixmati"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled", "vtab"] }
redb = "4"
rumqttc = "0.25"
axum = "0.8"
tonic = "0.14"
prost = "0.14"
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry-prometheus = "0.32"
prometheus = "0.14"
toml = "0.8"
